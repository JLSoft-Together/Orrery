name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop version v$version"
            exit 1
          fi
      - run: node apps/desktop/build.mjs --daemon-zip-only
      - uses: actions/upload-artifact@v4
        with:
          name: layout-daemon
          path: apps/layout-daemon/build/dist/layout-daemon-*.zip
          if-no-files-found: error
  build:
    needs: daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: apps/desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: layout-daemon
          path: apps/layout-daemon/build/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/core
      - run: npm ci
      # One dmg per arch, but npm only installs the host's node-pty prebuilt: fetch the other one too.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @lydell/node-pty-darwin-x64@1.2.0-beta.15 @lydell/node-pty-darwin-arm64@1.2.0-beta.15
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
