name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: apps/shell/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: apps/shell/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/shell/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/shell version v$version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/core
            apps/shell
      - run: npm ci
      - name: Fetch the signed phone APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/shell/package.json').version")
          gh release download "remote-apk-v$version" --repo "$GITHUB_REPOSITORY" --pattern orrery-remote.apk --dir "$RUNNER_TEMP"
          echo "ORRERY_APK=$RUNNER_TEMP/orrery-remote.apk" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=".planning/RELEASE-$version.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          awk '/^## Tiếng Việt/{on=1; next} /^## /{on=0} on' "$notes" | sed '/./,$!d' > notes.md
          gh release download "remote-apk-$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern orrery-remote.apk --dir dist
          mv dist/orrery-remote.apk "dist/Orrery-Remote-$version.apk"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --title "Orrery $GITHUB_REF_NAME" --notes-file notes.md dist/*.exe dist/*.dmg dist/*.apk
