<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1480">
<title>Kéo thả pane, Orrery Sương kính</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{--canvas:#EEF3F6;--g1:#C9ECE2;--g2:#D3E0FB;--g3:#F6DFD4;--glass:rgb(255 255 255/.55);--glass-pop:rgb(250 252 253/.86);--surface:rgb(255 255 255/.58);--control:rgb(255 255 255/.72);--hover:rgb(27 42 51/.06);--ink:#1B2A33;--muted:#53656F;--faint:#61737B;--line:rgb(28 60 80/.10);--line-strong:rgb(28 60 80/.18);--edge:rgb(255 255 255/.8);--accent:#2A7F9E;--accent-ink:#1D6886;--on-accent:#fff;--accent-soft:rgb(42 127 158/.14);--work:#2563A8;--work-soft:rgb(37 99 168/.12);--wait:#8A6400;--wait-soft:rgb(240 160 40/.18);--err:#BF3647;--err-soft:rgb(220 70 90/.13);--done:#1D7752;--done-soft:rgb(46 170 120/.16);--idle:#687A83;--claude:#C15F3C;--codex:#5E4FC0;--shell:#53656F;--well-solid:#111A20;--well-clear:rgb(17 31 40/.92);--well-ink:#E4EEF2;--well-dim:#8FA3AD;--shadow1:0 8px 24px -16px rgb(20 50 70/.22);--shadow2:0 18px 40px -12px rgb(20 50 70/.35)}
.app.dark{--canvas:#0F171D;--g1:rgb(40 125 120/.38);--g2:rgb(70 82 170/.34);--g3:rgb(150 80 95/.24);--glass:rgb(255 255 255/.05);--glass-pop:rgb(26 38 46/.88);--surface:rgb(255 255 255/.06);--control:rgb(255 255 255/.07);--hover:rgb(255 255 255/.06);--ink:#E4EEF2;--muted:#9FB2BB;--faint:#7F939C;--line:rgb(255 255 255/.09);--line-strong:rgb(255 255 255/.16);--edge:rgb(255 255 255/.10);--accent:#73C6DC;--accent-ink:#8FD3E5;--on-accent:#08202A;--accent-soft:rgb(115 198 220/.16);--work:#8AB4FF;--work-soft:rgb(138 180 255/.14);--wait:#F2D36B;--wait-soft:rgb(242 211 107/.16);--err:#FF919C;--err-soft:rgb(255 145 156/.14);--done:#6FD6A6;--done-soft:rgb(111 214 166/.14);--idle:#9FB2BB;--claude:#D97757;--codex:#A49CF0;--shell:#9FB2BB;--well-solid:#080D11;--well-clear:rgb(8 13 17/.55);--well-ink:#E4EEF2;--well-dim:#7F939C;--shadow1:0 8px 24px -16px rgb(0 0 0/.55);--shadow2:0 18px 40px -12px rgb(0 0 0/.72)}
.app{width:1440px;height:900px;box-sizing:border-box;padding:12px;display:grid;grid-template-columns:264px minmax(0,1fr);gap:12px;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(55% 45% at 6% 0%,var(--g1),transparent 72%),radial-gradient(50% 55% at 100% 6%,var(--g2),transparent 70%),radial-gradient(60% 50% at 55% 104%,var(--g3),transparent 72%),var(--canvas);position:relative;overflow:hidden;font-size:12px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--shadow1),inset 0 1px 0 var(--edge)}
.rail{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rhead{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.seg{display:flex;padding:2px;border-radius:999px;background:var(--hover);flex:1}
.seg button{flex:1;height:24px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 11px Manrope,sans-serif;cursor:pointer}
.seg button.on{background:var(--control);color:var(--ink);box-shadow:var(--shadow1)}
.search{margin:0 10px;height:30px;border-radius:10px;background:var(--control);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--faint)}
.kbd{font:600 10px "JetBrains Mono",monospace;padding:1px 5px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted)}
.groupseg{margin:8px 10px 0;display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;font-weight:600;color:var(--muted)}
.need{margin:10px 10px 4px;border-radius:14px;background:var(--wait-soft);border:1px solid color-mix(in srgb,var(--wait) 28%,transparent);padding:8px;display:flex;flex-direction:column;gap:6px}
.needh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--wait)}
.needh .n{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent-ink)}
.nitem{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface)}
.nitem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .r{grid-column:2;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .e{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.btn-open{grid-row:span 2;align-self:center;height:24px;padding:0 10px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);font:700 11px Manrope,sans-serif;cursor:pointer}
.list{flex:1;min-height:0;overflow:hidden;padding:4px 6px;display:flex;flex-direction:column;gap:1px}
.ph{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;margin-top:6px;font-weight:700;font-size:12px}
.mono{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.ph .br{font:500 10px "JetBrains Mono",monospace;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .c{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
.sec{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;margin-top:6px;font-size:11px;font-weight:700;color:var(--muted)}
.sec .c{margin-left:auto}
.row{display:grid;grid-template-columns:16px minmax(0,1fr) 28px;gap:0 8px;align-items:center;min-height:46px;padding:5px 8px;border-radius:12px;position:relative}
.row:hover{background:var(--hover)}
.row.on{background:var(--accent-soft)}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.l1{display:flex;align-items:center;gap:6px;min-width:0}
.rt{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tm{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.l2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0;margin-top:2px}
.l2>span{white-space:nowrap}
.l2 .d{overflow:hidden;text-overflow:ellipsis;min-width:0}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag{flex:none;font-size:10px;font-weight:700}
.ag.claude{color:var(--claude)}.ag.codex{color:var(--codex)}.ag.shell{color:var(--shell)}
.gauge{width:28px;height:4px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--muted);border-radius:2px}
.gauge.hi i{background:var(--wait)}
.st{width:14px;height:14px;display:grid;place-items:center}
.s-wait{color:var(--wait)}.s-work{color:var(--work)}.s-err{color:var(--err)}.s-done{color:var(--done)}.s-idle{color:var(--idle)}
.row.err .rt{color:var(--err)}
.rfoot{height:48px;border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 8px}
.ib{height:32px;min-width:32px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:600 11px Manrope,sans-serif;position:relative}
.ib:hover{background:var(--hover);color:var(--ink)}
.badge{position:absolute;top:3px;right:3px;min-width:14px;height:14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;box-sizing:border-box}
.quota{display:flex;flex-direction:column;gap:3px;padding:0 6px;margin-right:auto}
.qrow{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{width:56px;height:4px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.tabs{height:36px;border-radius:14px;display:flex;align-items:center;gap:4px;padding:0 4px}
.tab{height:28px;border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;color:var(--muted);font-weight:600;font-size:12px;border:0;background:transparent;font-family:inherit;cursor:pointer}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--control);color:var(--ink);box-shadow:var(--shadow1)}
.tab .mono{width:20px;height:20px;border-radius:999px}
.chip{height:20px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;padding:0 7px;font-size:11px;font-weight:600;white-space:nowrap}
.c-wait{background:var(--wait-soft);color:var(--wait)}.c-work{background:var(--work-soft);color:var(--work)}.c-err{background:var(--err-soft);color:var(--err)}.c-done{background:var(--done-soft);color:var(--done)}.c-meta{background:var(--hover);color:var(--muted)}
.tabs .sp{flex:1}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px}
.pane{border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow1)}
.pane.on{box-shadow:0 0 0 2px var(--accent),var(--shadow1);border-color:transparent}
.phd{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;flex:none}
.pane.on .phd{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pt{font-weight:650;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--muted);white-space:nowrap}
.phd .sp{flex:1}
.mini{width:24px;height:24px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.mini:hover{background:var(--hover);color:var(--ink)}
.well{flex:1;min-height:0;margin:0 6px 6px;border-radius:12px;background:var(--well);color:var(--well-ink);font:12px/18px "JetBrains Mono",ui-monospace,monospace;padding:10px 12px;overflow:hidden;white-space:pre}
.w-dim{color:var(--well-dim)}.w-acc{color:#73C6DC}.w-ok{color:#6FD6A6}.w-warn{color:#F2D36B}.w-cl{color:#E8835D}.w-cx{color:#B4AAF5}.w-sel{color:#fff;font-weight:600}
.menubar{margin:0 6px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px;border-radius:12px;background:var(--wait-soft);border:1px solid color-mix(in srgb,var(--wait) 25%,transparent)}
.menubar .q{font-size:11px;font-weight:700;color:var(--wait);margin-right:4px}
.mb{height:28px;border-radius:9px;border:1px solid var(--line-strong);background:var(--control);color:var(--ink);font:600 11px Manrope,sans-serif;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mb.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.mb .kbd{border-color:currentColor;opacity:.8}
.toast{position:absolute;right:24px;bottom:24px;width:340px;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--edge);box-shadow:var(--shadow2)}
.toast .tt{font-weight:700}
.toast .td{grid-column:2;font-size:11px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent-ink);font:700 11px Manrope,sans-serif;cursor:pointer;grid-row:span 2}

.app.flat{--g1:transparent;--g2:transparent;--g3:transparent;--canvas:#E9EEF1;--glass:#F6F9FA;--glass-pop:#FFFFFF;--surface:#FFFFFF;--control:#FFFFFF;--edge:#D5DEE3;--line:#E1E8EC;--line-strong:#C9D4DA;--hover:#EDF2F4;--shadow1:none;--shadow2:0 10px 30px -14px rgb(20 50 70/.30);--scrim:rgb(20 40 50/.32)}
.app.flat.dark{--canvas:#0E151A;--glass:#131D24;--glass-pop:#1A262E;--surface:#16212A;--control:#1D2A33;--edge:#24323B;--line:#22303A;--line-strong:#2E3E48;--hover:#1C2831;--shadow1:none;--shadow2:0 10px 30px -14px rgb(0 0 0/.7);--scrim:rgb(0 0 0/.55)}
.app.flat *{backdrop-filter:none!important}
.app.flat .glass,.app.flat .pop{box-shadow:none;border:1px solid var(--edge)}
.app.flat .rail,.app.flat .col,.app.flat .pane,.app.flat .ghost,.app.flat .ghost-pane,.app.flat .drawer,.app.flat .flyout{border-radius:10px}
.app.flat .tabs{border-radius:8px}
.app.flat .tab{border-radius:6px}
.app.flat .tab.on{box-shadow:inset 0 -2px 0 var(--accent);background:var(--surface)}
.app.flat .well,.app.flat .ghost-pane i{border-radius:6px}
.app.flat .need{border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--wait)}
.app.flat .nitem{border-radius:6px;background:var(--wait-soft)}
.app.flat .row,.app.flat .it,.app.flat .tr{border-radius:6px}
.app.flat .seg,.app.flat .seg button{border-radius:6px}
.app.flat .seg button.on{box-shadow:none;border:1px solid var(--line-strong)}
.app.flat .chip{border-radius:4px}
.app.flat .pane.on{box-shadow:0 0 0 2px var(--accent)}
.app.flat .menubar{border-radius:6px}
.app.flat .mb,.app.flat .btn,.app.flat .btn-open{border-radius:6px}
.app.flat .toast,.app.flat .pal,.app.flat .dlg{border-radius:12px;box-shadow:var(--shadow2)}
.app.flat .card{border-radius:10px}
.app.flat .pv{border-radius:6px}
.app.flat .dtab.on{box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.app.flat .logo,.app.flat .mono{border-radius:6px}
.panes3{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:8px}
.panes3 .pane:first-child{grid-row:span 2}
.pane{position:relative}
.srcdim{position:absolute;inset:0;border-radius:inherit;background:color-mix(in srgb,var(--canvas) 62%,transparent);display:grid;place-items:center;z-index:2}
.srcdim span{font-weight:700;font-size:12px;color:var(--muted);background:var(--control);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.ov{position:absolute;inset:0;z-index:3;pointer-events:none}
.prev{position:absolute;border-radius:14px;align-content:start;padding-top:18px;box-sizing:border-box;background:color-mix(in srgb,var(--accent) 12%,transparent);border:2px solid var(--accent);display:grid;place-items:center}
.prev.bad{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:var(--err)}
.prev.swap{background:transparent;border:2px dashed var(--accent)}
.plabel{font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow2)}
.prev.bad .plabel{background:var(--err);color:#fff}
.compass{position:absolute;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;transform:translate(-50%,-50%)}
.cz{border-radius:10px;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--edge);box-shadow:var(--shadow1);display:grid;place-items:center;color:var(--muted)}
.cz.hot{background:var(--accent);color:var(--on-accent);border-color:transparent}
.cz.bad{background:var(--err);color:#fff;border-color:transparent}
.ghost{position:absolute;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;border-radius:999px;background:var(--glass-pop);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--edge);box-shadow:var(--shadow2);font-weight:700;white-space:nowrap;z-index:5}
.ghost .sub{font-weight:600;font-size:11px;color:var(--muted)}
.cursor{position:absolute;z-index:6}
.tabwrap{position:relative}
.tab.spring{background:var(--accent-soft);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
.springbar{position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.springbar i{display:block;height:100%;width:65%;background:var(--accent)}
.tabtip{position:absolute;top:34px;left:0;white-space:nowrap;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow2);z-index:6}
.capt{position:absolute;left:300px;bottom:22px;z-index:7;max-width:760px;padding:8px 14px;border-radius:12px;background:var(--glass-pop);border:1px solid var(--edge);box-shadow:var(--shadow2);font-size:12px;color:var(--ink)}
.capt b{color:var(--accent-ink)}
.minirail{padding:8px;display:flex;flex-direction:column;gap:2px}
</style>

<style>
.mk-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;background:#0F171D;color:#E4EEF2;font:600 14px Manrope,system-ui,sans-serif}
.mk-bar a{color:#8FD3E5;text-decoration:none}
.mk-bar select{margin-left:6px;font:inherit;padding:4px 6px;border-radius:6px}
.mk-wrap{padding:20px;background:#0b1015}
</style>
</head>
<body style="margin:0;background:#0b1015">
<div class="mk-bar"><a href="./">← Tất cả màn</a><span>Kéo thả pane</span><label>scenario<select data-k="scenario"><option selected>la bàn chia</option><option>đổi chỗ</option><option>quá hẹp</option><option>sang tab</option><option>từ Explorer</option></select></label><label>style<select data-k="style"><option selected>kính</option><option>flat</option></select></label><label>theme<select data-k="theme"><option selected>light</option><option>dark</option></select></label></div>
<div class="mk-wrap"><div id="mk-root"></div></div>
<template id="mk-tpl">

<div class="app {{themeCls}}" style="--well: var(--well-solid)">
  <aside class="rail glass" aria-label="Session rail">
    <div class="rhead"><div class="logo" aria-hidden="true">O</div><div class="seg"><button class="on">Workspace</button><button>Giám sát</button></div></div>
    <div class="minirail">
      <div class="ph"><span class="mono" style="background: #2A7F9E">Or</span><span>Orrery</span><span class="c">3</span></div>
      <div class="row on"><span class="st s-wait">!</span><div style="min-width: 0"><div class="l1"><span class="rt">v101 dọn rác hệ thống</span><span class="tm">2m 14s</span></div><div class="l2"><span class="ag claude">Claude</span><span>Opus 5.5</span></div></div><span></span></div>
      <div class="row"><span class="st s-work">◌</span><div style="min-width: 0"><div class="l1"><span class="rt">Fix hash file trùng</span><span class="tm">1m 12s</span></div><div class="l2"><span class="ag codex">Codex</span><span>gpt-5.5</span></div></div><span></span></div>
      <div class="row"><span class="st s-idle">○</span><div style="min-width: 0"><div class="l1"><span class="rt">shell</span></div><div class="l2"><span class="ag shell">Shell</span><span>pwsh</span></div></div><span></span></div>
      <div class="ph"><span class="mono" style="background: #6A4FC9">Jt</span><span>jin-tools</span><span class="c">2</span></div>
      <div class="ph"><span class="mono" style="background: #C15F3C">Cl</span><span>cat-loop</span><span class="c">2</span></div>
    </div>
  </aside>
  <main class="stage">
    <nav class="tabs glass" aria-label="Tab">
      <button class="tab on"><span class="mono" style="background: #2A7F9E">Or</span>Dọn rác + file trùng</button>
      <button class="tab"><span class="mono" style="background: #2A7F9E">Or</span>UI Sương kính</button>
      <div class="tabwrap">
        <button class="tab {{springCls}}"><span class="mono" style="background: #6A4FC9">Jt</span>jin-tools<sc-if value="{{isTab}}" hint-placeholder-val="{{ false }}"><span class="springbar"><i></i></span></sc-if></button>
        <sc-if value="{{isTab}}" hint-placeholder-val="{{ false }}">
          <span class="tabtip">Giữ để mở tab jin-tools rồi thả</span>
          <span class="ghost" style="left: 40px; top: 46px"><span class="ag claude">Claude</span>v101 dọn rác hệ thống<span class="chip c-wait">Duyệt quyền</span></span>
        </sc-if>
      </div>
      <button class="tab"><span class="mono" style="background: #C15F3C">Cl</span>cat-loop</button>
      <span class="sp"></span>
    </nav>

<script>
class DCLogic { constructor(){ this.props = {}; this.state = {}; } setState(s){ Object.assign(this.state, s); render(); } }

class Component extends DCLogic {
  renderVals() {
    const sc = this.props.scenario ?? 'la bàn chia';
    const theme = this.props.theme ?? 'light';
    const isCompass = sc === 'la bàn chia', isSwap = sc === 'đổi chỗ', isNarrow = sc === 'quá hẹp', isTab = sc === 'sang tab', isExplorer = sc === 'từ Explorer';
    const caps = {
      'la bàn chia': '1, 5, 6: rê pane lên pane khác hiện la bàn 5 ô. Ô đang chọn tô accent, vùng xem trước ghi kết quả. Pane gốc phủ lớp mờ, ghost là pill có agent + tên + trạng thái.',
      'đổi chỗ': '5: ô giữa = đổi chỗ, viền nét đứt quanh cả 2 pane sẽ đổi.',
      'quá hẹp': '5: chia dưới làm pane còn 202px, dưới mức 220px nên ô và vùng xem trước chuyển đỏ, thả vào không làm gì.',
      'sang tab': '3: kéo pane lên tab khác, giữ khoảng 0,6 giây (thanh chạy dưới tab) thì nhảy sang tab đó để thả.',
      'từ Explorer': '4: kéo file từ Explorer (hoặc row từ rail) lên canvas dùng cùng la bàn, thả là mở viewer ở vị trí đó.'
    };
    const ghost = isExplorer
      ? { gAgent: 'File', gAgCls: 'shell', gTitle: 'dupes.rs', gSub: 'từ Explorer', gx: '930px', gy: '730px', cx: '1190px', cy: '672px' }
      : isSwap ? { gAgent: 'Claude', gAgCls: 'claude', gTitle: 'v101 dọn rác hệ thống', gSub: 'Duyệt quyền', gx: '900px', gy: '650px', cx: '1150px', cy: '626px' }
      : isNarrow ? { gAgent: 'Claude', gAgCls: 'claude', gTitle: 'v101 dọn rác hệ thống', gSub: 'Duyệt quyền', gx: '900px', gy: '262px', cx: '1150px', cy: '236px' }
      : { gAgent: 'Claude', gAgCls: 'claude', gTitle: 'v101 dọn rác hệ thống', gSub: 'Duyệt quyền', gx: '930px', gy: '730px', cx: '1190px', cy: '672px' };
    return Object.assign({
      themeCls: (theme === 'dark' ? 'dark' : '') + ((this.props.style ?? 'kính') === 'flat' ? ' flat' : ''),

      dimSrc: !isExplorer,
      showGhost: !isTab,
      springCls: isTab ? 'spring' : '',
      caption: caps[sc]

}

comp.props = Object.assign({}, defaults);

document.querySelectorAll('.mk-bar select').forEach(s => { if (comp.props[s.dataset.k] != null) s.value = comp.props[s.dataset.k]; });
document.querySelectorAll('.mk-bar select').forEach(s => s.addEventListener('change', () => { comp.props[s.dataset.k] = s.value; render(); }));
function get(scope, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope); }
function fill(str, scope) { return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, p) => { if (p === 'true') return 'true'; if (p === 'false') return 'false'; const v = get(scope, p); return typeof v === 'function' ? '' : (v ?? ''); }); }
function walk(node, scope) {
  const frag = document.createDocumentFragment();
  for (const ch of Array.from(node.childNodes)) {
    if (ch.nodeType === 3) { frag.appendChild(document.createTextNode(fill(ch.textContent, scope))); continue; }
    if (ch.nodeType !== 1) continue;
    const tag = ch.tagName.toLowerCase();
    if (tag === 'sc-if') { const m = ch.getAttribute('value').match(/\{\{\s*([^}]+?)\s*\}\}/); const v = m ? (m[1] === 'true' ? true : m[1] === 'false' ? false : get(scope, m[1])) : false; if (v) frag.appendChild(walk(ch, scope)); continue; }
    if (tag === 'sc-for') { const lp = ch.getAttribute('list').match(/\{\{\s*([^}]+?)\s*\}\}/)[1]; const as = ch.getAttribute('as'); (get(scope, lp) || []).forEach((it, i) => frag.appendChild(walk(ch, Object.assign({}, scope, { [as]: it, $index: i })))); continue; }
    const el = ch.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(ch.localName) : document.createElementNS(ch.namespaceURI, ch.localName);
    for (const a of Array.from(ch.attributes)) {
      if (/^on[A-Z]/.test(a.name) || /^on[a-z]+$/.test(a.name) && a.value.includes('{{')) { const m = a.value.match(/\{\{\s*([^}]+?)\s*\}\}/); const fn = m && get(scope, m[1]); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
      if (a.name.startsWith('hint-')) continue;
      el.setAttribute(a.name, fill(a.value, scope));
    }
    el.appendChild(walk(ch.content || ch, scope));
    frag.appendChild(el);
  }
  return frag;
}
function render() {
  const vals = comp.renderVals();
  const root = document.getElementById('mk-root');
  root.replaceChildren(walk(document.getElementById('mk-tpl').content, vals));
}
