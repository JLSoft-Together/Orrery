<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Màu Orrery v108</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script>
try {
  const s = localStorage.getItem('mau.scheme')
  document.documentElement.dataset.theme = s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
} catch (e) {
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-claude" viewBox="0 0 16 16"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v12M2.8 5l10.4 6M2.8 11l10.4-6"/></g></symbol>
  <symbol id="i-codex" viewBox="0 0 16 16"><path d="M8 1.8l5.4 3.1v6.2L8 14.2l-5.4-3.1V4.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-shell" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 6.5l2 1.6-2 1.6M8.6 10.2h2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-working" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-waiting" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.2 6.4a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="currentColor"/></symbol>
  <symbol id="i-idle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/></symbol>
  <symbol id="i-error" viewBox="0 0 16 16"><path d="M8 1.8l6.4 11.4H1.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".9" fill="currentColor"/></symbol>
  <symbol id="i-done" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.2 8.2l1.9 1.9 3.7-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-split" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 3v10" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13 9.8A5.5 5.5 0 0 1 6.2 3a5.5 5.5 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-dice" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.6" cy="5.6" r="1" fill="currentColor"/><circle cx="10.4" cy="10.4" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 5V4a1.5 1.5 0 0 0-1.5-1.5h-5A1.5 1.5 0 0 0 3 4v5.5A1.5 1.5 0 0 0 4.5 11H5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 16 16"><path d="M8 2.2l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 11l-3.5 1.9.8-3.9-2.9-2.7 3.9-.5z" fill="currentColor"/></symbol>
</svg>

<header class="top">
  <div class="top-in">
    <h1>Màu Orrery <span>v108</span></h1>
    <div class="seg" role="radiogroup" aria-label="Sáng / Tối">
      <button type="button" role="radio" data-scheme="light"><svg><use href="#i-sun"/></svg>Sáng</button>
      <button type="button" role="radio" data-scheme="dark"><svg><use href="#i-moon"/></svg>Tối</button>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="sec-head">
      <h2>Bảng màu mới</h2>
      <p class="hint">Bấm để chọn</p>
    </div>
    <div class="grid-new" id="newGrid"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Theme hiện có</h2>
      <p class="hint">Bấm để đổi Giữ / Bỏ</p>
    </div>
    <h3 class="sub">UI next</h3>
    <div class="grid-old" id="nextGrid"></div>
    <h3 class="sub">Classic <span class="hint">bỏ cùng classic ở 4.1.0</span></h3>
    <div class="grid-old" id="classicGrid"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>Ngẫu nhiên</h2>
    </div>
    <div class="rand" id="rand">
      <div class="rand-l">
        <span class="rand-ic"><svg><use href="#i-dice"/></svg></span>
        <div>
          <div class="rand-t">Mỗi lần mở, một màu</div>
          <div class="hint" id="randPool"></div>
        </div>
      </div>
      <div class="rand-stack" id="randStack"></div>
      <div class="rand-r">
        <button type="button" class="btn ghost" id="randTry"><svg><use href="#i-dice"/></svg>Thử</button>
        <button type="button" class="sw" id="randOn" role="switch" aria-checked="true"><span></span></button>
      </div>
      <div class="rand-pick" id="randPick" hidden></div>
    </div>
  </section>
</main>

<div class="dock">
  <div class="dock-in">
    <div class="dock-sum" id="sum"></div>
    <button type="button" class="btn primary" id="copy"><svg><use href="#i-copy"/></svg><span>Copy lựa chọn</span></button>
  </div>
</div>

<script src="palettes.js"></script>
<script src="app.js"></script>
</body>
</html>
