[workspace]
resolver = "2"
members = ["crates/core-procs", "crates/core-pty", "crates/core-transcript", "crates/core-store", "crates/core-bin", "crates/core-http", "crates/core-sources", "crates/core-monitor", "crates/core-toast"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "io-std", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
