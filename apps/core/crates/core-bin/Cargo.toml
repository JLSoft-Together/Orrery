[package]
name = "core-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orrery-core"
path = "src/main.rs"

[dependencies]
core-procs = { path = "../core-procs" }
core-pty = { path = "../core-pty" }
