[package]
name = "core-desk"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-procs = { path = "../core-procs" }
core-sources = { path = "../core-sources" }
core-transcript = { path = "../core-transcript" }
base64 = "0.23"
getrandom = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
regex = "1"
sha1 = "0.11"
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11"
url = "2"
ureq = { version = "3.1", default-features = false, features = ["rustls", "platform-verifier"] }
regress = "0.12.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
grammers-tl-types = "0.12"
grammers-crypto = "0.12"
grammers-mtproto = "0.12"
grammers-session = { version = "0.12", default-features = false }
grammers-mtsender = { version = "0.12", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_Time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
