[package]
name = "core-disk"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Com", "Win32_System_Registry", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "mft_pipe"
harness = false
