[package]
name = "core-monitor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "monitor-script"
path = "src/bin/monitor-script.rs"

[dependencies]
core-procs = { path = "../core-procs" }
core-store = { path = "../core-store" }
core-transcript = { path = "../core-transcript" }
core-http = { path = "../core-http" }
indexmap = "2"
notify ={ version = "8.2", default-features = false, features = ["macos_fsevent"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11"
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
