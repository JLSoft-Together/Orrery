[package]
name = "core-remote-proto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
zeroize = "1.8"
