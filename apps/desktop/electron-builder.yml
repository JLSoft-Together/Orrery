appId: dev.ccm.monitor
productName: Orrery
copyright: Orrery
directories:
  app: stage
  output: release
asar: true
# Chromium ships 55 UI locale packs (~49 MB); the app only speaks en / vi.
electronLanguages:
  - en-US
  - vi
compression: maximum
# utilityProcess.fork runs collector.cjs from disk, outside the archive.
asarUnpack:
  - collector.cjs
  - pty-host.cjs
afterPack: ./after-pack.cjs
npmRebuild: false
nodeGypRebuild: false
files:
  - main.cjs
  - collector.cjs
  - pty-host.cjs
  - preload.cjs
  - gramjs.cjs
  - package.json
extraResources:
  # node-pty + the prebuilt package for this platform/arch (npm installs only the host one).
  - from: ../../node_modules/@lydell
    to: pty/node_modules/@lydell
    filter: ['**/*', '!**/*.pdb']
  - from: ../web/dist
    to: web
  - from: ../layout-daemon/init/ccm-project-model.gradle
    to: layout-daemon/ccm-project-model.gradle
  # sql.js JS is bundled into main.cjs; its WASM is read from here (device app data inspector).
  - from: ../../node_modules/sql.js/dist/sql-wasm.wasm
    to: sqljs/sql-wasm.wasm
  - from: ../../scripts/statusline-bridge.mjs
    to: bridge/statusline-bridge.mjs
  - from: ../../scripts/hook-bridge.mjs
    to: bridge/hook-bridge.mjs
  - from: ../../scripts/assets/ccm.ico
    to: ccm.ico
  - from: ../../scripts/assets/ccmTrayTemplate.png
    to: ccmTrayTemplate.png
  - from: ../../scripts/assets/ccmTrayTemplate@2x.png
    to: ccmTrayTemplate@2x.png
mac:
  icon: ../../scripts/assets/ccm-mac.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc signature (arm64 refuses unsigned code), no notarization.
  # Hardened runtime + ad-hoc breaks Electron's library validation, so it stays off.
  identity: '-'
  hardenedRuntime: false
  extraResources:
    - from: ../core/target/bundle/${arch}/orrery-core
      to: core/orrery-core
    - from: ../core/target/bundle/${arch}/orrery-bridge
      to: core/orrery-bridge
  protocols:
    - name: Orrery
      schemes: [agent-monitor]
dmg:
  artifactName: Orrery-${version}-${arch}.${ext}
win:
  icon: ../../scripts/assets/ccm.ico
  extraResources:
    - from: ../core/target/bundle/${arch}/orrery-core.exe
      to: core/orrery-core.exe
    - from: ../core/target/bundle/${arch}/orrery-bridge.exe
      to: core/orrery-bridge.exe
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orrery
  artifactName: Orrery-Setup-${version}.${ext}
portable:
  artifactName: Orrery-Portable-${version}.${ext}
