<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Orrery</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <script>
      ;(function () {
        try {
          // Mirrors lib/themes.ts THEMES (checked by lib/themes.test.ts).
          var L = ['orrery-light', 'light', 'xcode-light', 'github-light', 'solarized-light', 'islands-light']
          var D = ['galaxy', 'orrery-dark', 'console', 'dark', 'xcode-dark', 'github-dark', 'solarized-dark', 'monokai', 'dracula', 'material', 'one-dark', 'islands-dark']
          function pick(t, m, light) {
            var known = L.indexOf(t) >= 0 || D.indexOf(t) >= 0
            return { t: known ? t : light ? 'orrery-light' : 'galaxy', w: m !== '4.1-v108' }
          }
          var r = document.documentElement
          var s = null
          var m = null
          try {
            s = localStorage.getItem('ccm.theme')
            m = localStorage.getItem('ccm.themeMigration')
          } catch (e) {}
          var p = pick(s, m, matchMedia('(prefers-color-scheme: light)').matches)
          var t = p.t
          if (p.w) {
            try {
              localStorage.setItem('ccm.theme', t)
              localStorage.setItem('ccm.themeMigration', '4.1-v108')
            } catch (e) {}
          }
          r.classList.toggle('dark', D.indexOf(t) >= 0)
          if (t !== 'light' && t !== 'dark') r.setAttribute('data-theme', t)
          try {
            if (localStorage.getItem('ccm.stars') === '0') r.setAttribute('data-stars', 'off')
            if (localStorage.getItem('ccm.starsPanels') === '0') r.setAttribute('data-stars-panels', 'off')
            var fx = localStorage.getItem('ccm.starsFx')
            r.setAttribute('data-stars-fx', fx === 'off' || fx === 'meteors' ? fx : 'twinkle')
          } catch (e) {}
          function pickUi(u, m) {
            if (m !== '4.1-next') return { u: 'next', w: true }
            return { u: u === 'classic' ? 'classic' : 'next', w: false }
          }
          var NP = { mist: 'ld', graphite: 'ld', mono: 'ld', galaxy: 'd', orrery: 'ld', nebula: 'ld', aurora: 'ld', dawn: 'ld', console: 'd', random: 'ld', custom: 'ld' }
          function pickNext(u, nt, dk, mo, rm) {
            var ui = u === 'classic' ? 'classic' : 'next'
            var id = NP.hasOwnProperty(nt) ? nt : 'mist'
            var s = NP[id]
            var dark = ui === 'next' && s.indexOf(dk ? 'd' : 'l') < 0 ? s.charAt(0) === 'd' : dk
            var motion = mo === 'full' || mo === 'reduced' || mo === 'off' ? mo : rm ? 'reduced' : 'full'
            return { ui: ui, theme: id, dark: dark, glass: 'reduced', motion: motion }
          }
          try {
            var pu = pickUi(localStorage.getItem('ccm.uiGeneration'), localStorage.getItem('ccm.uiMigration'))
            if (pu.w) {
              try {
                localStorage.setItem('ccm.uiGeneration', pu.u)
                localStorage.setItem('ccm.uiMigration', '4.1-next')
              } catch (e) {}
            }
            var n = pickNext(
              pu.u,
              localStorage.getItem('ccm.nextTheme'),
              r.classList.contains('dark'),
              localStorage.getItem('ccm.next.motion'),
              matchMedia('(prefers-reduced-motion: reduce)').matches
            )
            r.setAttribute('data-ui', n.ui)
            r.setAttribute('data-motion', n.motion)
            if (n.glass === 'reduced') r.setAttribute('data-glass', 'reduced')
            if (n.ui === 'next') {
              r.removeAttribute('data-theme')
              r.setAttribute('data-next-theme', n.theme)
              r.classList.toggle('dark', n.dark)
              if (n.theme === 'custom') {
                try {
                  var cj = JSON.parse(localStorage.getItem('ccm.next.custom') || 'null')
                  var cv = cj && cj.v === 1 && cj.css ? cj.css[n.dark ? 'dark' : 'light'] : null
                  if (cv && typeof cv === 'object')
                    for (var ck in cv)
                      if (/^--ccm-[a-z-]+$/.test(ck) && typeof cv[ck] === 'string' && !(ck === '--ccm-glass' && n.glass === 'reduced')) r.style.setProperty(ck, cv[ck])
                } catch (e) {}
              }
              if (n.theme === 'random') {
                try {
                  var rj = JSON.parse(localStorage.getItem('ccm.next.randomPalette') || 'null')
                  var rc = rj && rj.v === 1 ? (!rj.held && rj.upcomingCss ? rj.upcomingCss : rj.css) : null
                  var rv = rc ? rc[n.dark ? 'dark' : 'light'] : null
                  if (rv && typeof rv === 'object')
                    for (var rk in rv)
                      if (/^--ccm-[a-z0-9-]+$/.test(rk) && typeof rv[rk] === 'string' && !(rk === '--ccm-glass' && n.glass === 'reduced')) r.style.setProperty(rk, rv[rk])
                } catch (e) {}
              }
            }
          } catch (e) {
            r.setAttribute('data-ui', 'classic')
          }
          try {
            var l = localStorage.getItem('ccm.locale')
            if (l === 'vi' || l === 'en') document.documentElement.lang = l
          } catch (e) {}
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-theme', 'galaxy')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
