<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Orrery</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <script>
      ;(function () {
        try {
          // Mirrors lib/themes.ts THEMES (checked by lib/themes.test.ts).
          var L = ['orrery-light', 'light', 'xcode-light', 'github-light', 'solarized-light', 'islands-light']
          var D = ['orrery-dark', 'console', 'galaxy', 'dark', 'xcode-dark', 'github-dark', 'solarized-dark', 'monokai', 'dracula', 'material', 'one-dark', 'islands-dark']
          function pick(t, m, light) {
            var known = L.indexOf(t) >= 0 || D.indexOf(t) >= 0
            if (m !== '4.0.2') return { t: (known ? L.indexOf(t) >= 0 : light) ? 'orrery-light' : 'orrery-dark', w: true }
            return { t: known ? t : light ? 'orrery-light' : 'orrery-dark', w: false }
          }
          var r = document.documentElement
          var s = null
          var m = null
          try {
            s = localStorage.getItem('ccm.theme')
            m = localStorage.getItem('ccm.themeMigration')
          } catch (e) {}
          var p = pick(s, m, matchMedia('(prefers-color-scheme: light)').matches)
          var t = p.t
          if (p.w) {
            try {
              localStorage.setItem('ccm.theme', t)
              localStorage.setItem('ccm.themeMigration', '4.0.2')
            } catch (e) {}
          }
          r.classList.toggle('dark', D.indexOf(t) >= 0)
          if (t !== 'light' && t !== 'dark') r.setAttribute('data-theme', t)
          try {
            if (localStorage.getItem('ccm.stars') === '0') r.setAttribute('data-stars', 'off')
          } catch (e) {}
          try {
            var l = localStorage.getItem('ccm.locale')
            if (l === 'vi' || l === 'en') document.documentElement.lang = l
          } catch (e) {}
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-theme', 'orrery-dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
