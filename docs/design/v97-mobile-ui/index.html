<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orrery Remote — mockup UI + motion (WP-28)</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.215,.61,.355,1);--ease-in:cubic-bezier(.55,.055,.675,.19);--spring:cubic-bezier(.3,1.25,.5,1);--d-fast:150ms;--d-base:220ms;--d-slow:300ms}
html,body{background:#eceef2;color:#17171c;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.solo{background:transparent}
body.solo .phone{border:0;border-radius:0}

.phone{--r-card:10px;--r-ctl:8px;--r-in:6px;width:360px;height:800px;position:relative;overflow:hidden;border-radius:28px;font:14px/1.4 var(--font);background:var(--canvas);color:var(--ink);border:1px solid var(--line-strong);flex:none;user-select:none}
.phone[data-theme=light]{--canvas:#f3f3f6;--surface:#fff;--raised:#ececf1;--control:#fff;--line:rgba(23,23,28,.09);--line-strong:rgba(23,23,28,.18);--ink:#17171c;--muted:#55555f;--faint:#61616c;--accent:#bd5128;--accent-ink:#b04a24;--on-accent:#fff;--sel:#f6dccf;--well:#18181c;--well-ink:#e5e5ea;--working:#b02f00;--waiting:#7f5500;--idle:#61616c;--done:#1b6f30;--error:#c4001a;--stale:#64646e;--warning:#b02f00;--add:#1b6f30;--del:#c4001a;--mod:#0b5cad;--claude:#c15f3c;--codex:#6a4fc9;--shell:#0f7f78;--chipf:0%;--scrim:rgba(0,0,0,.45)}
.phone[data-theme=dark]{--canvas:#000;--surface:#08080a;--raised:#0d0d10;--control:#16161a;--line:#1c1c20;--line-strong:#2a2a30;--ink:#ececf1;--muted:#a6a6b0;--faint:#85858f;--accent:#e8835d;--accent-ink:#f0946f;--on-accent:#1a110d;--sel:#35261f;--well:#030304;--well-ink:#e5e5ea;--working:#f5a524;--waiting:#f7d046;--idle:#8e8e9a;--done:#4cc38a;--error:#ff6b6b;--stale:#8e8e9a;--warning:#f5a524;--add:#4cc38a;--del:#ff6b6b;--mod:#6ea8fe;--claude:#d97757;--codex:#9d8cf8;--shell:#4cc2b8;--chipf:0%;--scrim:rgba(0,0,0,.6)}

.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:var(--ink)}
.sb .r{display:flex;gap:6px;align-items:center}
.gest{position:absolute;left:0;right:0;bottom:0;height:20px;display:flex;align-items:center;justify-content:center}
.gest i{display:block;width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.5}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow:hidden;position:relative}
.pad{padding:0 16px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.f{fill:currentColor;stroke:none}
.mono{font-family:var(--mono)}

.top{height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;flex:none}
.top.big{height:auto;padding:8px 16px 8px;align-items:flex-end}
.top h1{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.top.big h1{font-size:28px;line-height:34px;letter-spacing:-.02em;padding:0}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink);flex:none}
.ib.s{width:36px;height:36px}
.sub{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:12px}
.phone[data-theme=dark] .card{border-color:var(--line)}
.phone[data-theme=dark] .card{background:#08080a}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-size:15px;font-weight:600;line-height:20px}
.t2{font-size:12px;color:var(--muted);line-height:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:14px 16px 6px}
.lbl.in{padding:14px 0 6px}

.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) var(--chipf),transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.chip .ic{width:14px;height:14px;stroke-width:2}
.st-working{--c:var(--working)}.st-waiting{--c:var(--waiting)}.st-idle{--c:var(--idle)}.st-done{--c:var(--done)}.st-error{--c:var(--error)}.st-stale{--c:var(--stale)}.st-lan{--c:var(--done)}.st-relay{--c:var(--mod)}.st-conn{--c:var(--warning)}.st-off{--c:var(--stale)}
.phone[data-theme=light] .st-waiting{--c:#7f5500}
.spin{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink));flex:none}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.agent{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.agent .ic{width:18px;height:18px}
.a-claude{--ac:var(--claude)}.a-codex{--ac:var(--codex)}.a-shell{--ac:var(--shell)}
.ses{display:flex;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.ses:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.ses .mid{flex:1;min-width:0}
.ses .tool{margin-top:6px;font:11.5px/16px var(--mono);color:var(--muted);background:var(--raised);border-radius:var(--r-in);padding:3px 8px}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.meta .ic{width:13px;height:13px}

.btn{height:44px;border-radius:var(--r-ctl);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn.p{background:var(--accent);color:var(--on-accent)}
.btn.s{background:var(--control);color:var(--ink);border-color:var(--line-strong)}
.btn.d{background:transparent;color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent)}
.btn.t{background:transparent;color:var(--accent-ink)}
.btn.w{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.fab{position:absolute;right:16px;bottom:34px;height:52px;border-radius:16px;padding:0 20px 0 16px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border:0}

.nav{height:68px;flex:none;display:flex;border-top:1px solid var(--line-strong);background:var(--canvas);padding-bottom:20px;height:76px}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);position:relative;padding-top:4px}
.nav div.on{color:var(--accent-ink)}
.nav div.on:before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:1px;background:var(--accent)}
.nav .bd{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--waiting);color:#1a1200;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

.seg{display:flex;background:var(--raised);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg div{flex:1;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg div.on{background:var(--control);color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line-strong);overflow:hidden;flex:none}
.tabs div{height:40px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--faint);white-space:nowrap;position:relative}
.tabs div.on{color:var(--ink)}
.tabs div.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-strong);background:var(--control);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.pill.on{border-color:var(--ac,var(--accent));background:color-mix(in srgb,var(--ac,var(--accent)) 12%,transparent)}
.pill .dot{width:8px;height:8px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-card);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--ink)}
.banner .ic{color:var(--c);margin-top:1px}
.banner b{display:block;font-size:13px}
.banner span{font-size:12px;color:var(--muted)}

.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line-strong);padding:8px 16px 36px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 12px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:10px}

.grp{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);margin:0 16px;overflow:hidden}
.phone[data-theme=dark] .grp{border-color:var(--line)}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic.lead{color:var(--accent-ink)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--raised);border:1px solid var(--line-strong);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--faint)}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{left:21px;background:var(--on-accent)}
.val{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}

.term{background:var(--well);color:var(--well-ink);font:12px/17px var(--mono);padding:10px 12px;overflow:hidden;flex:1;min-height:0;white-space:pre}
.term .g{color:#30d158}.term .r{color:#ff6961}.term .y{color:#ffd60a}.term .b{color:#64d2ff}.term .m{color:#da8fff}.term .d{color:#8e8e93}.term .o{color:var(--claude)}
.cur{display:inline-block;width:7px;height:14px;background:#e5e5ea;vertical-align:-2px}
.keys{display:flex;gap:6px;padding:8px 8px 0;background:var(--surface);border-top:1px solid var(--line-strong);overflow:hidden;flex:none}
.keys div{min-width:40px;height:40px;padding:0 10px;border-radius:var(--r-ctl);background:var(--control);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);flex:none}
.keys div.on{background:var(--sel);border-color:var(--accent);color:var(--accent-ink)}
.inp{display:flex;gap:8px;padding:8px 8px 28px;background:var(--surface);flex:none}
.inp .f{flex:1;height:44px;border-radius:22px;border:1px solid var(--line-strong);background:var(--control);display:flex;align-items:center;padding:0 16px;font:13px var(--mono);color:var(--faint)}
.inp .go{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}

.code{background:var(--well);color:var(--well-ink);font:12px/18px var(--mono);padding:8px 0;overflow:hidden;flex:1;white-space:pre}
.code .ln{display:flex}
.code .n{width:38px;text-align:right;padding-right:10px;color:#6e6e78;flex:none}
.code .k{color:#ff7ab2}.code .s{color:#ff8170}.code .nu{color:#d9c97c}.code .ty{color:#6bdfff}.code .fn{color:#67b7a4}
.code .add{background:rgba(76,195,138,.16)}.code .del{background:rgba(255,107,107,.16)}
.code .add .n{color:#4cc38a}.code .del .n{color:#ff6b6b}
.hunk{font:11px/18px var(--mono);color:#8e8e9a;padding:2px 12px;background:rgba(110,168,254,.1)}

.qr{width:100%;aspect-ratio:1;background:var(--well);border-radius:var(--r-card);position:relative;overflow:hidden}
.qr .cn{position:absolute;width:36px;height:36px;border:3px solid var(--accent);}
.cell{width:44px;height:52px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--control);display:flex;align-items:center;justify-content:center;font:600 20px var(--mono)}
.cell.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.bad{border-color:var(--error)}

.noti{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:12px 14px;margin:0 12px 8px}
.phone[data-theme=dark] .noti{background:#111114;border-color:var(--line)}
.noti .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
.noti .si{width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.noti .si .ic{width:11px;height:11px;stroke-width:2.2}
.noti .tt{font-size:14px;font-weight:600}
.noti .bd2{font-size:13px;color:var(--muted);margin-top:2px}
.noti .ac{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.noti .ac b{font-size:13px;color:var(--accent-ink);padding:6px 10px;border-radius:14px;font-weight:600}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 32px;gap:8px}
.empty h2{font-size:20px;font-weight:600;margin-top:8px}
.empty p{font-size:14px;color:var(--muted);max-width:280px}

.pc{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);overflow:hidden;position:relative;padding:10px 10px 10px 13px}
.phone[data-theme=dark] .pc{border-color:var(--line)}
.pc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.pc .pv{font:10.5px/14px var(--mono);color:var(--faint);margin-top:8px;white-space:pre;overflow:hidden;background:var(--well);color:var(--well-ink);border-radius:var(--r-in);padding:6px 8px;height:62px}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.fab.n{bottom:92px}

body{padding:0 0 80px}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px}
header.hd{padding:40px 0 20px}
header.hd h1{font-size:34px;letter-spacing:-.02em;line-height:40px}
header.hd p{color:#55555f;font-size:15px;max-width:760px;margin-top:8px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:#f6dccf;color:#9f431c;margin-right:6px}
nav.pn{position:sticky;top:0;z-index:20;background:#eceef2;border-bottom:1px solid rgba(0,0,0,.1);display:flex;gap:4px;padding:8px 20px;overflow:hidden;flex-wrap:wrap}
nav.pn a{font-size:13px;font-weight:600;color:#55555f;text-decoration:none;padding:6px 12px;border-radius:14px}
nav.pn a:hover{background:#fff;color:#17171c}
section.sc{padding:36px 0 8px}
section.sc>h2{font-size:24px;letter-spacing:-.01em;margin-bottom:4px}
section.sc>.lead{color:#55555f;font-size:14px;margin-bottom:20px;max-width:820px}
.scr-grp{margin-bottom:36px}
.scr-grp h3{font-size:16px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pair{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.fig{display:flex;flex-direction:column;gap:8px}
.fig figcaption{font-size:12px;font-weight:600;color:#55555f}
.fig .phone{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.opt{background:#fff;border-radius:14px;padding:16px;border:1px solid rgba(0,0,0,.08);margin-bottom:16px;max-width:1160px}
.opt b{font-size:14px}
.opt p{font-size:13px;color:#55555f;margin-top:4px;line-height:1.5}
.pros{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.pros span{flex:1;min-width:240px}
.pros .ok b{color:#1b6f30}.pros .no b{color:#c4001a}
table.tb{border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;width:100%;max-width:1360px;font-size:13px;margin-bottom:20px}
table.tb th,table.tb td{text-align:left;padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.07);vertical-align:top}
table.tb th{background:#f6f6f9;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#61616c}
table.tb code,.opt code{font:12px var(--mono);background:#f1f1f5;padding:1px 5px;border-radius:4px}
.sw2{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.comp{display:flex;gap:24px;flex-wrap:wrap}
.comp .phone{width:560px;height:auto;padding:20px;border-radius:16px}
.comp .rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.mcard{background:#fff;border-radius:14px;padding:14px;border:1px solid rgba(0,0,0,.08)}
.mcard h4{font-size:14px}.mcard p{font-size:12px;color:#55555f;margin:4px 0 10px;min-height:48px;line-height:1.45}
.mstage{height:230px;background:var(--canvas);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;position:relative;overflow:hidden;padding:12px;font:14px var(--font)}
.mstage.c{display:flex;align-items:center;justify-content:center}
.mstage.mnav{padding:0}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{padding:8px 10px}
.mctl{display:flex;gap:8px;margin-top:10px}
.mctl button,.rmbtn{font:600 13px var(--font);height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:#fff;cursor:pointer;color:#17171c}
.mctl button:hover{background:#f6dccf}
.pg{position:absolute;inset:0;padding:16px;background:var(--canvas)}
.p2{background:var(--surface)!important}
.scr0{position:absolute;inset:0;background:var(--scrim)}
.sh0{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px 20px;border-top:1px solid var(--line-strong);height:120px}
.sh0 .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 12px}
.ind{position:absolute;top:14px;left:50%;margin-left:-12px;width:24px;height:24px;color:var(--accent-ink)}
.ind svg{width:24px;height:24px}
.pl{padding:12px;position:relative}
.dmo{width:auto!important;height:auto!important;background:transparent!important;border:0!important;border-radius:0!important;overflow:visible!important}
.tool-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap;font-size:13px}
.q{background:#fff;border-radius:14px;padding:16px 20px;max-width:1000px;border:1px solid rgba(0,0,0,.08)}
.q ol{padding-left:20px;font-size:14px;line-height:1.7}
body.rm *{animation-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){.spin,.pulse{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>const P={
monitor:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
layers:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
terminal:'<path d="M4 6l5 5-5 5M12 18h8"/>',
file:'<path d="M6 3h8l5 5v13H6zM14 3v5h5"/>',

<script>const RM=()=>document.body.classList.contains('rm')||matchMedia('(prefers-reduced-motion: reduce)').matches;

const anim=(el,kf,ms,ease='cubic-bezier(.215,.61,.355,1)',o={})=>{
  if(RM()){kf=kf.map(f=>{const g={...f};delete g.transform;return g});ms=90;ease='linear'}
  return el.animate(kf,{duration:ms,easing:ease,fill:'both',...o});
};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const rowHtml=(n,t,st)=>`<span class="agent a-${n}">${ic(n==='claude'?'spark':n==='codex'?'hex':'terminal')}</span><div class="grow"><div class="t1 ell nm">${t}</div><div class="t2">claude-code-monitor</div></div>${chip(st)}`;

demo('list','Danh sách: thêm / xoá / đổi tên','Dòng mới trượt từ trên xuống và hiện dần; dòng xoá trượt ra phải và mờ, các dòng dưới dịch lên bằng FLIP (chỉ transform).',(box)=>{
  box.innerHTML='<div class="mstage"><div class="mlist"></div></div><div class="mctl"><button data-a="add">Thêm</button><button data-a="ren">Đổi tên</button><button data-a="del">Xoá</button></div>';
  const list=box.querySelector('.mlist');let n=0;const names=['Refactor AdsGate','Review PR #482','flutter test','npm run dev','Sửa lỗi pty.overflow'];
  const mk=(t,a,st)=>{const r=el('div','card row mrow',rowHtml(a,t,st));return r};
  [['claude','Dựng mockup UI mobile','working'],['codex','Sửa lỗi pty.overflow','waiting']].forEach(x=>list.append(mk(x[1],x[0],x[2])));
  const flip=(fn)=>{const rs=[...list.children];const b=new Map(rs.map(r=>[r,r.getBoundingClientRect().top]));fn();[...list.children].forEach(r=>{if(!b.has(r))return;const d=b.get(r)-r.getBoundingClientRect().top;if(d)anim(r,[{transform:`translateY(${d}px)`},{transform:'none'}],D(220))})};
  box.querySelector('.mctl').onclick=e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==='add'){const r=mk(names[n++%5],['claude','codex','shell'][n%3],'idle');flip(()=>list.prepend(r));anim(r,[{opacity:0,transform:'translateY(-14px)'},{opacity:1,transform:'none'}],D(220))}
    if(a==='del'&&list.children.length){const r=list.lastElementChild;const t=list.children[0];const x=list.children.length>1?list.children[1]:r;anim(x,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(40px)'}],D(150),'cubic-bezier(.55,.055,.675,.19)').finished.then(()=>flip(()=>x.remove()))}
    if(a==='ren'&&list.firstElementChild){const nm=list.firstElementChild.querySelector('.nm');anim(nm,[{opacity:1},{opacity:0}],D(150)).finished.then(()=>{nm.textContent=names[n++%5];anim(nm,[{opacity:0},{opacity:1}],D(150));anim(list.firstElementChild,[{backgroundColor:'color-mix(in srgb,var(--accent) 22%,transparent)'},{backgroundColor:'transparent'}],D(300),'linear')})}
  };
});
