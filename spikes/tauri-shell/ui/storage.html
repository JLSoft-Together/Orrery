<!doctype html>
<html><head><meta charset="utf-8" /></head>
<body>
<script>
const tag = new URLSearchParams(location.search).get('tag')
const prior = localStorage.getItem('spike-n')
localStorage.setItem('spike-n', String(Number(prior || 0) + 1))
fetch('/report', { method: 'POST', body: JSON.stringify({ kind: 'storage', tag, prior, origin: location.origin }) })
document.body.textContent = 'storage ' + tag + ' prior=' + prior
</script>
</body></html>
